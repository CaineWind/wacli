name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Audit full dependency tree
        run: npm run audit:all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test client
        run: npm run test:client

      - name: Test server
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack npm artifact
        run: npm --silent pack --ignore-scripts

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wind-agent-cli-${{ github.sha }}
          path: wind-agent-cli-*.tgz
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: Windows package smoke (Node 22)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Build package
        run: npm run build

      - name: Install packed package and run CLI
        shell: pwsh
        run: |
          $tarball = npm --silent pack --ignore-scripts
          $prefix = Join-Path $env:RUNNER_TEMP 'wind-agent-cli-smoke'
          npm install --prefix $prefix --ignore-scripts --omit=dev ".\$tarball"
          & (Join-Path $prefix 'node_modules\.bin\wacli.cmd') --version
