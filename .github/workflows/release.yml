name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11

      - name: Validate release tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test "$PACKAGE_NAME" = "wind-agent-cli"

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm run test:client
          npm test
          npm run build

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          TARBALL="$(npm --silent pack --ignore-scripts)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "wind-agent-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public --provenance

      - name: Verify npm release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in {1..12}; do
            PUBLISHED_VERSION="$(npm view "wind-agent-cli@${VERSION}" version --prefer-online 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
              exit 0
            fi
            echo "Waiting for npm registry propagation (attempt ${attempt}/12)..."
            sleep 10
          done

          echo "wind-agent-cli@${VERSION} was not visible in the npm registry after 120 seconds."
          exit 1

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "wacli $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$TARBALL" --clobber
